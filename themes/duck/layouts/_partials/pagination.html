{{ if gt .TotalPages 1 }}
<nav class="pager" aria-label="Pagination">
  {{ with .Prev }}<a href="{{ .URL }}">« Newer posts</a>{{ else }}<span class="pager-off">« Newer posts</span>{{ end }}
  <span class="pager-off">Page {{ .PageNumber }} of {{ .TotalPages }}</span>
  {{ with .Next }}<a href="{{ .URL }}">Older posts »</a>{{ else }}<span class="pager-off">Older posts »</span>{{ end }}
</nav>
{{ end }}
