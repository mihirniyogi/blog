{{- /*
  Light/dark switch. Starts hidden: assets/js/theme-toggle.js shows it and sets
  its label, so visitors without JavaScript never see a button that does nothing.
*/ -}}
<button type="button" class="theme-toggle" aria-label="Switch to dark theme" hidden>
  {{ partial "ui/icon.html" "moon" }}
  {{ partial "ui/icon.html" "sun" }}
  <span class="theme-toggle-text">Dark</span>
</button>
