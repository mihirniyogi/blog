<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>

  <div class="site">

    <header class="band">
      {{ partial "site/header.html" . }}
    </header>

    <div class="tabs">
      {{ partial "site/menu.html" (dict "menuID" "main" "page" .)}}
    </div>

    <div class="layout">

      <main class="content">
        {{ block "main" . }}{{ end }}
      </main>

      {{ partial "sidebar.html" . }}

    </div>

    <footer class="site-footer">
      {{ partial "site/footer.html" . }}
    </footer>

  </div>

</body>
</html>
